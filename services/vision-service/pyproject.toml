[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiosk-vision-service"
version = "0.1.0"
description = "Vision service of the smart kiosk: capture, detection, tracking, attributes and audience events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
kiosk-vision = "kiosk_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kiosk_vision"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
