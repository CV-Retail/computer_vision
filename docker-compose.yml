# Perfiles:
#   all-in-one -> todo en un host (servidor + estación)
#   server     -> lado servidor: postgres, redis, core-backend y web
#   kiosk      -> estación: vision-service (el player es Chromium apuntando a http://<servidor>/player)
#
# Punto de entrada único: el servicio web (nginx) publica el puerto ${WEB_PORT:-80}.
#   /admin y /player -> aplicación web;  /api y /ws -> core-backend (solo interno).
# core-backend no publica puerto en el host.
# redis (Valkey) publica el 6379 con contraseña obligatoria, por defecto solo en 127.0.0.1 (ver REDIS_BIND_ADDR).
# vision-service corre en all-in-one y en kiosk y no depende de Redis ni Postgres, porque en una
# estación separada esos servicios no existen.
services:
  postgres:
    image: postgres:16
    profiles: [all-in-one, server]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # El bus de eventos habla el protocolo de Redis, pero la imagen es Valkey (fork BSD-3-Clause de Redis 7.2):
  # Redis 7.4+ ya no es BSD (RSALv2/SSPLv1). Por eso se mantienen el nombre del servicio, las variables REDIS_*
  # y las URL redis://, que son las del protocolo.
  redis:
    image: valkey/valkey:8
    profiles: [all-in-one, server]
    restart: unless-stopped
    # Sin "user" el envoltorio de abajo correría como root: la imagen solo baja privilegios con valkey-server directo.
    user: valkey
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    # Una contraseña vacía en --requirepass DESACTIVA la autenticación, por eso se exige aquí.
    command:
      - sh
      - -c
      - 'test -n "$$REDIS_PASSWORD" || { echo "REDIS_PASSWORD is required" >&2; exit 1; }; exec valkey-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      # Por defecto solo esta máquina. En un servidor con estaciones separadas, REDIS_BIND_ADDR = IP de la LAN.
      - "${REDIS_BIND_ADDR:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  vision-service:
    build: ./services/vision-service
    profiles: [all-in-one, kiosk]
    restart: "no"
    # La cámara (devices: /dev/video0) se añade en KIO-10.
    environment:
      # En una estación separada, define EVENT_TRANSPORT_URL en .env con la dirección del servidor.
      EVENT_TRANSPORT_URL: ${EVENT_TRANSPORT_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}

  core-backend:
    build: ./services/core-backend
    profiles: [all-in-one, server]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Variables neutrales al motor de base de datos: cambiar de motor es solo configuración.
      DB_VENDOR: postgresql
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    # Solo interno: se accede por el proxy del servicio web (/api y /ws).

  web:
    build: ./apps/web
    profiles: [all-in-one, server]
    restart: unless-stopped
    depends_on:
      core-backend:
        condition: service_healthy
    ports:
      # Único puerto de aplicación publicado. Cambia WEB_PORT si el 80 está ocupado.
      - "${WEB_PORT:-80}:8080"

volumes:
  pgdata:
