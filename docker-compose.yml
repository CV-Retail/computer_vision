# Perfiles:
#   all-in-one -> todo en un host
#   server     -> backend + infraestructura
#   kiosk      -> visión + player en la estación
# vision-service corre en all-in-one y en kiosk (nunca en server) y no depende de
# Redis ni Postgres, porque en una estación separada esos servicios no existen.
# Los demás servicios de aplicación se añaden cuando exista su código.
services:
  postgres:
    image: postgres:16
    profiles: [all-in-one, server]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    profiles: [all-in-one, server]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  vision-service:
    build: ./services/vision-service
    profiles: [all-in-one, kiosk]
    restart: "no"
    # La cámara (devices: /dev/video0) se añade en KIO-10.
    environment:
      # En una estación separada, define EVENT_TRANSPORT_URL en .env con la dirección del servidor.
      EVENT_TRANSPORT_URL: ${EVENT_TRANSPORT_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}

  # core-backend: profiles: [all-in-one, server]

volumes:
  pgdata:
