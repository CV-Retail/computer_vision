# Perfiles:
#   all-in-one -> todo en un host
#   server     -> backend + infraestructura
#   kiosk      -> visión + player en la estación
# Los servicios de aplicación se añaden cuando exista su código.
services:
  postgres:
    image: postgres:16
    profiles: [all-in-one, server]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    profiles: [all-in-one, server]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  # core-backend:   profiles: [all-in-one, server]
  # vision-service: profiles: [all-in-one, kiosk]  (devices: /dev/video0)

volumes:
  pgdata:
